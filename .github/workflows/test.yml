name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/validate_blueos_project.py
      - run: python -m unittest discover -s tests -v
      - name: test BlueOS TTS services
        working-directory: my-application-1
        run: node --experimental-default-type=module scripts/test-tts-services.mjs
